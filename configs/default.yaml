# ALL tunable numbers, Every value that came from a design decision sawyws where it originates from.

#default.yaml

sim:
  gravcomp: 1.0     # 1 = perfect gravity compensation (model assumption 1); <1 is a Part E mismatch test
  dt_sim: 0.002
  dt_ctrl: 0.01      # control and abserver period
  dt_cam: 0.05        # 20 Hz camera
  grasp_capture_depth: 0.05   # m, cube centre at most this far ahead of tool0 for the weld to catch it (descend_height 0.03 + margin)
  image_width: 320
  image_height: 240

camera:
  fovy_deg: 60        # must match models ur3/ur3.xml

noise:
  sigma_q: 0.0005     # rad, encoder noise (assumption: roughly a 13-bit encoder)
  depth_a: 0.0015     # sigma_d = a + b Z^2, the Week 4 RGB-D noise model
  depth_b: 0.0022
  pixel_sigma: 0.5    # px, centroid noise (asumption)
  dropout_prob: 0.01

detection:
  hue_max: 10         # OpenCV hue is 0.179; red wraps around 0
  hue_min_wrap: 170
  s_min: 100
  v_min: 60
  min_area_px: 30

localisation:
  min_depth_px: 20
  surface_to_centre: 0.02   # m, half of object.size: depth sees the top face, cube centre is this far below (measured +20.0 mm bias over 20 seeds)

modelling:
  joint_inertia: [0.3503, 0.4300, 0.1060, 0.0164, 0.0116, 0.0103]   # diag(M) at the home pose, from sim/inertia.py
  damping: 1.0     # matches the MJCF joint damping
  home_q: [0.466, -3.029, 1.141, 0.318, -1.571, 0.0]

observer:
  sigma_tau: [6.0, 6.0, 3.0, 0.9, 0.9, 0.9]   # N m, unmodelled torque (coupling, inertia change with pose). Tuned on dev seeds: 3x the first guess took NEES from 98 to 18 (expect 12)

object_filter:
  q_obj: 1.0e-6   # m^2/s. radnom-walk, intensity for a static cube

lqr:
  q_err_max: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]    # rad, Bryson limits
  qd_max: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]             # rad/s
  integral: true
  qi_max: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]       # rad s

servo:
  lam: 1.0                    # visual servo gain
  qd_limit: 1.0               # rad/s cap on commanded joint rate
  pre_grasp_height: 0.10      # m above the cube centre along tool z


object:
  size: 0.04                  # m, cube edge (must match models/scene.xml)
  region:                     # m, base frame. Chosen so the cube is visible from the home pose
    x_min: 0.22
    x_max: 0.34
    y_min: -0.08
    y_max: 0.08

grasp:
  search_timeout: 2.0         # s without a first detection -> fail
  approach_tol: 0.012         # m, tool-frame error to the pre-grasp point
  descend_height: 0.03        # m, tool origin above cube centre when the gripper closes
  descend_tol: 0.008          # m
  settle_time: 0.3            # s of zero reference before the weld closes
  lift_height: 0.15           # m above the grasp point
  lift_tol: 0.01              # m
  phase_timeout: 8.0          # s per motion phase
  hold_time: 1.0
  success_lateral_tol: 0.01   # m, cube centre within this of the tool axis when the gripper closes
  success_height: 0.10        # m, cube centre above the table at the end counts as picked
  success_hold_tol: 0.03      # m, cube centre within this of the tool origin (xy) at the end (interfaces.md 6 proposal)

disturbance: {}               # see sim/disturbances.py; overridden by configs/sweeps/disturbance.yaml
